<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>감정 명언 테라피</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        button {
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-[100dvh] flex items-center justify-center p-0 sm:p-4 overflow-x-hidden">

    <main class="w-full max-w-[412px] h-[100dvh] sm:h-[720px] bg-gradient-to-br from-slate-50 to-indigo-50/80 sm:rounded-[32px] shadow-2xl flex flex-col justify-between p-3.5 sm:p-4 border border-white/20 overflow-hidden relative">
        
        <div class="flex flex-col h-full justify-between">
            <header class="text-center pt-1 pb-1 shrink-0">
                <span class="inline-block px-3 py-0.5 bg-indigo-100 text-indigo-800 text-xs font-black rounded-full mb-1 tracking-wide shadow-sm">마음 쉼터</span>
                <h1 class="text-base font-black text-slate-900 mb-0.5 tracking-tight whitespace-nowrap">오늘, 당신의 마음은 어떤가요?</h1>
                <p class="text-slate-700 text-[11px] font-bold whitespace-nowrap">감정을 선택하면 위로가 되는 명언을 전해드려요.</p>
            </header>

            <nav aria-label="감정 선택" class="grid grid-cols-2 gap-2 my-2 shrink-0">
                <button type="button" 
                        onclick="handleEmotionClick('joy', event)" 
                        ontouchstart="handleEmotionClick('joy', event)"
                        class="group relative flex flex-row items-center justify-center space-x-3 py-5 px-3 rounded-2xl bg-amber-50 active:bg-amber-200 hover:bg-amber-100 border-2 border-amber-200 transition-all shadow-sm">
                    <span class="text-3xl group-hover:scale-110 transition-transform">☀️</span>
                    <div class="text-left">
                        <div class="font-black text-amber-950 text-lg leading-tight">기쁨</div>
                        <div class="text-xs text-amber-900 font-bold">행복 더 크게</div>
                    </div>
                </button>

                <button type="button" 
                        onclick="handleEmotionClick('sadness', event)" 
                        ontouchstart="handleEmotionClick('sadness', event)"
                        class="group relative flex flex-row items-center justify-center space-x-3 py-5 px-3 rounded-2xl bg-sky-50 active:bg-sky-200 hover:bg-sky-100 border-2 border-sky-200 transition-all shadow-sm">
                    <span class="text-3xl group-hover:scale-110 transition-transform">🌧️</span>
                    <div class="text-left">
                        <div class="font-black text-sky-950 text-lg leading-tight">슬픔</div>
                        <div class="text-xs text-sky-900 font-bold">마음의 위로</div>
                    </div>
                </button>

                <button type="button" 
                        onclick="handleEmotionClick('fatigue', event)" 
                        ontouchstart="handleEmotionClick('fatigue', event)"
                        class="group relative flex flex-row items-center justify-center space-x-3 py-5 px-3 rounded-2xl bg-emerald-50 active:bg-emerald-200 hover:bg-emerald-100 border-2 border-emerald-200 transition-all shadow-sm">
                    <span class="text-3xl group-hover:scale-110 transition-transform">🍃</span>
                    <div class="text-left">
                        <div class="font-black text-emerald-950 text-lg leading-tight">지침</div>
                        <div class="text-xs text-emerald-900 font-bold">잠시 쉬어가기</div>
                    </div>
                </button>

                <button type="button" 
                        onclick="handleEmotionClick('anxiety', event)" 
                        ontouchstart="handleEmotionClick('anxiety', event)"
                        class="group relative flex flex-row items-center justify-center space-x-3 py-5 px-3 rounded-2xl bg-purple-50 active:bg-purple-200 hover:bg-purple-100 border-2 border-purple-200 transition-all shadow-sm">
                    <span class="text-3xl group-hover:scale-110 transition-transform">🌙</span>
                    <div class="text-left">
                        <div class="font-black text-purple-950 text-lg leading-tight">불안</div>
                        <div class="text-xs text-purple-900 font-bold">마음 진정</div>
                    </div>
                </button>
            </nav>

            <div class="flex-1 flex flex-col justify-center my-1 min-h-[220px]">
                <section id="quote-card" class="hidden bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-2xl p-4 sm:p-5 shadow-xl fade-in relative overflow-hidden border border-indigo-500/30">
                    <div class="absolute -right-3 -bottom-3 text-white/5 text-7xl font-serif select-none">“</div>
                    
                    <div class="flex items-center justify-between mb-2.5">
                        <div class="flex items-center space-x-2">
                            <span id="quote-badge" class="px-3 py-0.5 bg-white/20 text-white text-sm rounded-full font-black"></span>
                        </div>
                        <button type="button" 
                                onclick="getRandomQuote(event)" 
                                ontouchstart="getRandomQuote(event)" 
                                class="text-sm sm:text-base text-indigo-200 hover:text-white underline transition-colors py-1 px-3 font-black bg-white/10 rounded-xl active:bg-white/20">
                            다른 명언 ↺
                        </button>
                    </div>

                    <blockquote id="quote-text" class="text-lg sm:text-[21px] font-black leading-relaxed mb-3 text-indigo-50">
                        <!-- Quote text goes here -->
                    </blockquote>

                    <p id="quote-author" class="text-right text-indigo-200 text-base sm:text-[18px] font-black">
                        <!-- Author goes here -->
                    </p>
                </section>

                <!-- Initial Placeholder State -->
                <div id="initial-state" class="text-center py-8 px-4 text-slate-800 border-2 border-dashed border-slate-300 rounded-2xl bg-white/80 shadow-sm">
                    <p class="text-base sm:text-lg font-black">위의 감정 버튼 중 하나를 눌러보세요.</p>
                </div>
            </div>

            <footer class="text-center text-slate-700 text-xs sm:text-sm pt-1 shrink-0 font-bold">
                &copy; 2026 감정 명언 테라피. 당신의 하루를 응원합니다.
            </footer>
        </div>

    </main>

    <script>
        const quotesData = {

                    { text: "웃음은 마음의 일광욕이다.", author: "윌리엄 새커리" },
                    { text: "기쁨을 나누면 배가 되고, 슬픔을 나누면 반이 된다.", author: "스웨덴 속담" },

                    { text: "작은 일에 감사하는 마음이 커다란 기쁨을 낳는다.", author: "톨스토이" },

                    { text: "기쁨이 넘치는 삶에는 불평이 들어설 자리가 없다.", author: "에머슨" },

                    { text: "즐거움은 영혼의 비타민입니다.", author: "쇼펜하우어" },
                    { text: "오늘도 기분 좋은 일들이 당신을 기다리고 있습니다.", author: "안칠라" },
                    { text: "기쁨을 찾는 눈을 가진 자에게 세상은 온통 보물섬이다.", author: "알랭" },
                    { text: "환하게 웃는 그 얼굴 속에 진정한 아름다움이 있습니다.", author: "오드리 햅번" }

            const randomIndex = Math.floor(Math.random() * availableIndices.length);
            const quoteIndex = availableIndices[randomIndex];
            const selectedQuote = emotionData.quotes[quoteIndex];

            recentIndices[emotionKey].push(quoteIndex);
            if (recentIndices[emotionKey].length > 20) {
                recentIndices[emotionKey].shift();
            }

            const initialState = document.getElementById('initial-state');
            if (initialState) {
                initialState.classList.add('hidden');
            }
            
            const quoteCard = document.getElementById('quote-card');
            if (quoteCard) {
                quoteCard.classList.remove('hidden');
                quoteCard.classList.remove('fade-in');
                void quoteCard.offsetWidth;
                quoteCard.classList.add('fade-in');

                document.getElementById('quote-badge').innerText = `# ${emotionData.name}`;
                document.getElementById('quote-text').innerText = `"${selectedQuote.text}"`;
                document.getElementById('quote-author').innerText = `- ${selectedQuote.author} -`;
            }
        }

        function getRandomQuote(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!currentEmotion) return;
            selectEmotion(currentEmotion);
        }
    </script>

</body>
</html>
